[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
base_url = "https://practicesoftwaretesting.com"
testpaths = ["tests"]
markers = [
    "smoke: critical tests that verify the application is available",
    "regression: broader functional regression tests",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
